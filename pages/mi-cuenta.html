<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi cuenta - Hotel Alejandro I</title>
  <link rel="stylesheet" href="../assets/villa/css/bootstrap.css">
  <link rel="stylesheet" href="../assets/villa/css/style.css">

  <!-- ESTILOS CON FONDO DE IMAGEN -->
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: url('../../../../imgs/fondo-mi-cuenta.jpg.jpg') no-repeat center center/cover;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Capa oscura para mejorar legibilidad */
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1;
    }

    .account-box {
      position: relative;
      z-index: 2;
      background: rgba(255, 255, 255, 0.95);
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      max-width: 420px;
      width: 100%;
      backdrop-filter: blur(5px);
    }

    .btn-option {
      width: 100%;
      margin-bottom: 1rem;
    }

    .divider {
      margin: 1.5rem 0;
      text-align: center;
      color: #6c757d;
    }

    h2 {
      color: #000000;
    }
  </style>
</head>

<body>
  <div class="account-box">
    <h2 class="text-center mb-4">Mi cuenta</h2>

    <!-- USUARIO EXISTENTE -->
    <a class="btn btn-primary btn-option" href="ingresar-usuario.html">Ingresar como usuario</a>

    <!-- ADMINISTRADOR -->
    <a class="btn btn-outline-primary btn-option" href="ingresar-admin.html">Ingresar como operador / administrador</a>

    <div class="divider">¿No tenés cuenta?</div>

    <!-- CREAR NUEVO USUARIO -->
    <a class="btn btn-link btn-option" href="crear-cuenta.html">Crear cuenta nueva</a>

    <!-- VOLVER ATRÁS -->
    <div class="text-center mt-3">
      <a href="index.html" class="text-muted">← Volver al inicio</a>
    </div>
  </div>
</body>
</html>
